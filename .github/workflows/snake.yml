name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:       # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=0891b2&color_dots=ebedf0,ddd6fe,a78bfa,7c3aed,5b21b6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=22d3ee&color_dots=161b22,3b2a6b,6d28d9,8b5cf6,c4b5fd

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
